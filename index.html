:root[data-theme="dark"]{
--bg:#081A16;--surface:#0F2C27;--surface-2:#153831;
--ink:#F4F1E8;--ink-2:#B7C2B6;--ink-3:#8A9A90;--line:#1F443B;--line-fort:#2B5549;
--accent-action:#C8F35B;--accent-texte:#C8F35B;--accent-soft:#29482E;
--pos:#6CC6D6;--pos-soft:#163B42;--warn:#E0A530;--warn-soft:#2E2509;
--track:#24493F;--grille:#24493F;--seg-actif:#21493F;--vignette:#153831;--carte-fond:#0E1110;
--brand-name:#F4F1E8;--hero-line:#1F443B;--toast-bg:#21493F;
--repere-bg:#21493F;--repere-ink:#F4F1E8;--repere-sel-bg:#C8F35B;--repere-sel-ink:#0F2C27;--repere-bord:#0F2C27;--repere-trait:rgba(244,241,232,.22);
--trace-bord:#081A16;--point-loin:#8A9A90;--point-loin-bord:#081A16;--zone:#C8F35B;
--dep-bord:#C8F35B;--dep-fond:#081A16;--arr-bord:#081A16;--arr-fond:#C8F35B;
--curseur-fond:#F4F1E8;--curseur-bord:#081A16;--curseur-ink:#0F2C27;
--ombre-carte:none;--ombre-legere:0 1px 2px rgba(0,0,0,.3),0 4px 12px rgba(0,0,0,.25);--ombre-forte:0 1px 2px rgba(0,0,0,.3),0 16px 40px rgba(0,0,0,.45);
color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
:root{--encoche:env(safe-area-inset-top,0px)}
html{height:100%}
html{scroll-padding-top:calc(var(--bandeau) + var(--encoche) + 8px)}
body{margin:0;min-height:100%;padding-top:calc(var(--bandeau) + var(--encoche));font-family:var(--font);font-size:var(--t-texte);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button,select{font:inherit;color:inherit;cursor:pointer}
b,strong{font-weight:600}
a{color:var(--accent-texte)}
a:hover{color:var(--ink)}
button:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid var(--accent-action);outline-offset:2px}
h1,h2,h3{margin:0;font-family:var(--font-display);font-weight:600;letter-spacing:-.015em}
option{background:var(--surface);color:var(--ink)}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.plein{fill:currentColor}
.chiffre{font-variant-numeric:tabular-nums}

/* ---------- bandeau du haut (repris de Senzu) */
.bandeau-haut{position:fixed;z-index:950;top:0;left:0;right:0;height:calc(var(--bandeau) + var(--encoche));padding-top:var(--encoche);background:var(--bar-bg);border-bottom:1px solid var(--bar-line);color:var(--bar-ink)}
.bh-int{height:100%;padding:0 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.marque{all:unset;cursor:pointer;display:flex;align-items:center;gap:9px;flex:none;border-radius:var(--r-petit)}
.marque:focus-visible{outline:2px solid var(--logo);outline-offset:4px}
.marque-logo{width:24px;height:27px;color:var(--logo);line-height:0;flex:none}
.marque-logo svg{width:100%;height:100%;display:block}
.marque-nom{font-family:var(--font-display);font-weight:600;font-size:21px;letter-spacing:-.02em;line-height:1;color:var(--brand-name)}
.bh-droite{display:flex;align-items:center;gap:6px;min-width:0}
.btn-theme{width:40px;height:40px;flex:none;border:none;border-radius:var(--r-moyen);background:none;color:var(--bar-ink-2);display:flex;align-items:center;justify-content:center;padding:0}
.btn-theme:hover{background:var(--bar-hover);color:var(--bar-ink)}
.bandeau-haut button:focus-visible{outline-color:var(--logo)}
.puce-pos{display:flex;align-items:center;gap:8px;height:36px;min-width:0;padding:0 12px;border:1px solid var(--bar-line);border-radius:999px;background:var(--bar-hover);font-size:var(--t-legende);font-weight:500;color:var(--bar-ink)}
.puce-pos:hover{background:var(--bar-active)}
.puce-pos span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.puce-pos .point{width:8px;height:8px;border-radius:50%;background:var(--pos-bar);box-shadow:0 0 0 3px rgba(108,198,214,.22);flex:none}
.puce-pos .ic{width:16px;height:16px;color:var(--bar-ink-2)}
body.sur-carte .puce-pos{display:none}

/* ---------- boutons : deux hauteurs (36, 44) */
.btn-principal{height:44px;border:none;border-radius:var(--r-moyen);background:var(--accent-fill);color:var(--on-accent);font-size:var(--t-texte);font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 16px;text-decoration:none;transition:filter .15s}
.btn-principal:hover{filter:brightness(1.06);color:var(--on-accent)}
.btn-principal[aria-busy="true"]{opacity:.75;cursor:progress}
.btn-secondaire{height:44px;border:1px solid var(--line-fort);border-radius:var(--r-moyen);background:var(--surface);color:var(--ink);font-size:var(--t-texte);font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 14px;text-decoration:none}
.btn-secondaire:hover{background:var(--surface-2);color:var(--ink)}
.btn-petit{height:36px;font-size:var(--t-meta)}
.lien{border:none;background:none;color:var(--accent-texte);font-weight:600;text-decoration:none;font-size:var(--t-meta);padding:8px;margin:-8px}
.lien:hover{color:var(--ink)}
.message{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border-radius:var(--r-carte);background:var(--surface);border:1px solid var(--line);box-shadow:var(--ombre-carte);color:var(--ink-2);font-size:var(--t-meta);line-height:1.45}
.message > .ic{width:18px;height:18px;color:var(--warn);margin-top:1px}
.message > span{flex:1;min-width:0}
.message code{font-family:ui-monospace,Menlo,monospace;font-size:var(--t-legende);background:var(--surface-2);color:var(--ink);padding:1px 5px;border-radius:4px}
.message .fermer-message{flex:none;width:32px;height:32px;margin:-6px -8px -6px 0;border:none;border-radius:var(--r-petit);background:none;color:var(--ink-3);display:flex;align-items:center;justify-content:center;padding:0}
.message .fermer-message:hover{background:var(--surface-2);color:var(--ink)}
.message .fermer-message .ic{width:16px;height:16px}
.segment{display:flex;padding:3px;border-radius:var(--r-moyen);background:var(--surface-2);gap:3px}
.segment button{flex:1;height:36px;border:none;border-radius:8px;background:transparent;font-size:var(--t-meta);font-weight:500;color:var(--ink-2)}
.segment button[aria-pressed="true"]{background:var(--seg-actif);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(15,44,39,.1)}
.titre-bloc{font-size:var(--t-bloc)}
.sur-titre{font-size:var(--t-legende);font-weight:600;color:var(--accent-texte);text-transform:uppercase;letter-spacing:.06em}
.barres{display:flex;gap:3px}
.barres i{width:16px;height:4px;border-radius:2px;background:var(--track)}
.barres i.plein{background:var(--ink)}

/* ---------- accueil */
#accueil{padding:20px 20px 96px}
.acc{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.acc-titre{display:flex;flex-direction:column;gap:4px}
.acc-titre small{font-size:var(--t-meta);color:var(--ink-3);font-weight:500}
.acc-titre h1{font-size:var(--t-page);line-height:1.15;letter-spacing:-.02em}
.acc-grille{display:grid;grid-template-columns:minmax(0,1fr);gap:24px}
.acc-col{display:flex;flex-direction:column;gap:24px;min-width:0}
/* séance du jour : même vert profond que le bandeau, accents citron */
.carte-jour{background:var(--hero-bg);color:var(--bar-ink);border:1px solid var(--hero-line);border-radius:var(--r-grand);padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--ombre-legere)}
.carte-jour .sur-titre{color:var(--logo)}
.carte-jour button:focus-visible,.carte-jour a:focus-visible{outline-color:var(--logo)}
.jour-tete{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tag-seance{display:flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:999px;background:var(--bar-active);color:var(--logo);font-size:var(--t-legende);font-weight:600}
.tag-seance .ic{width:14px;height:14px}
.jour-titre{all:unset;cursor:pointer;font-family:var(--font-display);font-size:var(--t-carte);font-weight:600;line-height:1.3;letter-spacing:-.015em;color:var(--bar-ink)}
.jour-titre:hover{color:var(--logo)}
.jour-titre:focus-visible{outline:2px solid var(--logo);outline-offset:2px;border-radius:4px}
.jour-meta{font-size:var(--t-meta);color:var(--bar-ink-2);margin-top:-8px}
.jour-profil{display:block;width:100%;height:52px}
.jp-aire{fill:rgba(200,243,91,.14)}
.jp-ligne{fill:none;stroke:var(--logo);stroke-width:2.5;stroke-linejoin:round}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stats b{display:block;font-family:var(--font-display);font-size:var(--t-bloc);font-weight:600;color:var(--bar-ink)}
.stats small{display:block;font-size:var(--t-legende);color:var(--bar-ink-2)}
.jour-actions{display:flex;gap:8px}
.jour-actions .btn-principal{flex:1}
.carte-jour .btn-secondaire{background:transparent;border-color:rgba(244,241,232,.22);color:var(--bar-ink)}
.carte-jour .btn-secondaire:hover{background:var(--bar-hover)}
.carte-jour .vide{color:var(--bar-ink-2)}
.carte-jour .vide b{color:var(--bar-ink)}
.bloc{display:flex;flex-direction:column;gap:10px}
.bloc-tete{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.tuiles-seances{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:0 20px 2px}
.tuiles-seances::-webkit-scrollbar{display:none}
.tuile-seance{flex:none;width:88px;padding:12px 6px;border-radius:var(--r-carte);background:var(--surface);border:1px solid var(--line);box-shadow:var(--ombre-carte);display:flex;flex-direction:column;align-items:center;gap:8px;font-size:var(--t-legende);font-weight:600;text-align:center;color:var(--ink);transition:border-color .15s}
.tuile-seance:hover{border-color:var(--accent-action)}
.tuile-seance .pastille{width:40px;height:40px;border-radius:var(--r-moyen);background:var(--accent-soft);color:var(--accent-action);display:flex;align-items:center;justify-content:center}
.tuile-seance .pastille .ic{width:20px;height:20px}
.liste-carte{background:var(--surface);border:1px solid var(--line);box-shadow:var(--ombre-carte);border-radius:var(--r-carte);padding:4px 12px}
.proche{all:unset;box-sizing:border-box;width:100%;cursor:pointer;display:flex;align-items:center;gap:12px;padding:10px 0;min-height:56px}
.proche + .proche{border-top:1px solid var(--line)}
.proche:focus-visible{outline:2px solid var(--accent-action);outline-offset:-2px;border-radius:8px}
.proche .vignette{width:48px;height:34px}
.proche:hover b{color:var(--accent-texte)}

/* ---------- carte et panneau */
#resultats{position:fixed;top:calc(var(--bandeau) + var(--encoche));left:0;right:0;bottom:calc(var(--barre) + env(safe-area-inset-bottom))}
#carte{position:absolute;inset:0;background:var(--carte-fond)}
.leaflet-container{font-family:var(--font);background:var(--carte-fond)}
.leaflet-container a{color:var(--accent-texte)}
/* sources de la carte : une bulle « i » (ouverte à l'arrivée, repliée dès que je touche la carte) */
.info-carte{position:absolute;z-index:560;right:12px;bottom:12px;display:flex;align-items:flex-end;justify-content:flex-end;gap:6px;max-width:calc(100% - 24px);pointer-events:none}
.info-carte > *{pointer-events:auto}
.info-texte{display:none;font-size:11px;line-height:1.45;font-weight:500;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:5px 10px;box-shadow:var(--ombre-legere)}
.info-carte.ouverte .info-texte{display:block}
.info-texte a{color:inherit;text-decoration:none}
.info-texte a:hover{color:var(--ink);text-decoration:underline}
.info-bouton{position:relative;width:28px;height:28px;flex:none;border:1px solid var(--bar-line);border-radius:50%;background:var(--bar-bg);color:var(--bar-ink);font-family:var(--font-display);font-size:14px;font-weight:600;line-height:1;display:flex;align-items:center;justify-content:center;padding:0;box-shadow:var(--ombre-legere)}
.info-bouton::after{content:"";position:absolute;inset:-8px}
.info-carte.ouverte .info-bouton{background:var(--surface);color:var(--ink);border-color:var(--line)}
.leaflet-tooltip{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:var(--r-petit);box-shadow:var(--ombre-legere);font-size:var(--t-legende);font-weight:600}
.leaflet-tooltip-top:before{border-top-color:var(--surface)}
.repere-ancre{background:none;border:none}
.repere{width:28px;height:28px;border-radius:50%;border:1px solid var(--repere-trait);background:var(--repere-bg);color:var(--repere-ink);font-family:var(--font);font-size:var(--t-legende);font-weight:600;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(15,44,39,.32)}
.repere.sel{width:24px;height:24px;background:var(--repere-sel-bg);border:4px solid var(--repere-sel-ink);box-shadow:0 0 0 2px var(--repere-bord),0 2px 8px rgba(15,44,39,.35)}
.etiquette-carte{position:absolute;transform:translate(-50%,calc(-100% - 14px));white-space:nowrap;padding:6px 10px;border-radius:var(--r-petit);background:var(--surface);border:1px solid var(--line);font-family:var(--font);font-size:var(--t-legende);font-weight:600;box-shadow:var(--ombre-legere);color:var(--ink)}
.outils{position:absolute;z-index:500;right:16px;top:16px;display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.groupe-outils{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-moyen);box-shadow:var(--ombre-legere);overflow:hidden}
.groupe-outils hr{margin:0;border:none;height:1px;background:var(--line)}
.outil{width:44px;height:44px;border:none;background:var(--surface);color:var(--ink);display:flex;align-items:center;justify-content:center;padding:0}
.outil:hover{background:var(--surface-2)}
.outil.seul{border:1px solid var(--line);border-radius:var(--r-moyen);box-shadow:var(--ombre-legere)}
.outil.bleu{color:var(--pos)}
.outil[aria-busy="true"] .ic{animation:localise 1s ease-in-out infinite}
@keyframes localise{50%{opacity:.3}}
.menu-fond{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-moyen);box-shadow:var(--ombre-forte);padding:6px;display:flex;flex-direction:column;min-width:200px}
.menu-fond button{border:none;background:none;text-align:left;min-height:40px;padding:0 10px;border-radius:var(--r-petit);font-size:var(--t-texte);font-weight:500;color:var(--ink);display:flex;align-items:center;gap:10px}
.menu-fond button{justify-content:space-between}
.menu-fond button:hover{background:var(--surface-2)}
.menu-fond button[aria-pressed="true"]{color:var(--accent-texte);font-weight:600}
.toast{position:fixed;z-index:990;left:50%;bottom:calc(var(--barre) + 16px + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:min(520px,calc(100% - 32px));padding:12px 14px;border-radius:var(--r-moyen);background:var(--toast-bg);color:var(--toast-ink);font-size:var(--t-meta);font-weight:500;line-height:1.45;box-shadow:var(--ombre-forte)}
.toast code{font-family:ui-monospace,Menlo,monospace;font-size:var(--t-legende);background:rgba(244,241,232,.12);padding:1px 4px;border-radius:4px}
#panneau{position:absolute;z-index:700;left:16px;top:16px;bottom:16px;width:400px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-grand);box-shadow:var(--ombre-forte);display:flex;flex-direction:column;overflow:hidden;scroll-margin-top:calc(var(--bandeau) + var(--encoche))}
.panneau-tete{padding:16px 16px 12px;display:flex;flex-direction:column;gap:12px;border-bottom:1px solid var(--line);flex:none}
.panneau-corps{flex:1;overflow-y:auto;min-height:0}
.rond{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:flex;align-items:center;justify-content:center;flex:none;padding:0}
.rond:hover{background:var(--surface-2)}
.poignee{display:none}
.tete-ligne{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:32px}
.compte{font-size:var(--t-meta);color:var(--ink-3);white-space:nowrap}
.compte b{font-family:var(--font-display);font-size:var(--t-bloc);font-weight:600;color:var(--ink);letter-spacing:-.01em}
.puces{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 64px 2px 16px;-webkit-mask-image:linear-gradient(90deg,#000 85%,transparent);mask-image:linear-gradient(90deg,#000 85%,transparent)}
.puces::-webkit-scrollbar{display:none}
.puce-seance{flex:none;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:var(--t-meta);font-weight:500;color:var(--ink)}
.puce-seance:hover{border-color:var(--line-fort)}
.puce-seance[aria-pressed="true"]{border-color:var(--accent-action);background:var(--accent-soft);color:var(--accent-texte);font-weight:600}
.liste{padding:8px 8px 16px;display:flex;flex-direction:column}
.liste-tete{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 8px 8px;font-size:var(--t-legende);color:var(--ink-3)}
.liste-tete b{color:var(--ink);font-weight:600}
.tri-liste{position:relative;display:flex;align-items:center;gap:6px;font-size:var(--t-legende);color:var(--ink-3)}
.tri-liste select{appearance:none;-webkit-appearance:none;border:none;background:transparent;height:32px;padding:0 18px 0 0;font:inherit;font-size:var(--t-legende);font-weight:600;color:var(--ink)}
.tri-liste .ic{position:absolute;right:0;top:50%;width:13px;height:13px;margin-top:-6.5px;stroke-width:2.5;color:var(--ink);pointer-events:none}
.note{margin:0 8px 8px;padding:8px 10px;border-radius:var(--r-petit);background:var(--surface-2);font-size:var(--t-legende);color:var(--ink-2);line-height:1.4}
.element{border-radius:var(--r-carte)}
.element + .element{margin-top:2px}
.element.sel{background:var(--accent-soft)}
.element-clic{all:unset;box-sizing:border-box;width:100%;padding:10px;display:flex;align-items:center;gap:12px;cursor:pointer;border-radius:var(--r-carte)}
@media (hover:hover){.element:not(.sel) .element-clic:hover{background:var(--surface-2)}}
.element-clic:focus-visible{outline:2px solid var(--accent-action);outline-offset:-2px}
.vignette{width:56px;height:40px;border-radius:var(--r-petit);background:var(--vignette);flex:none;display:block}
.element.sel .vignette{background:var(--surface)}
.vg{fill:none;stroke:var(--ink-3);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.vg.actif{stroke:var(--accent-action)}
.element-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.element-txt b,.proche b{font-size:var(--t-texte);font-weight:600;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.element-txt small,.proche small{font-size:var(--t-legende);color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.element.sel .element-txt small,.element.sel .element-val small{color:var(--ink-2)}
.proche .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.element-val,.proche .val{display:flex;flex-direction:column;align-items:flex-end;flex:none}
.element-val b,.proche .val b{font-family:var(--font-display);font-size:var(--t-texte);font-weight:600}
.element-val small,.proche .val small{font-size:var(--t-legende);color:var(--ink-3)}
.element-actions{display:flex;gap:8px;padding:0 10px 10px}
.element-actions > *{flex:1}
.plus{margin:10px 8px 0}
.selection-carte{padding-bottom:8px;margin-bottom:8px;border-bottom:1px solid var(--line)}
.leaflet-interactive.trace-inerte{cursor:grab}
.vide{padding:28px 16px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;font-size:var(--t-texte);color:var(--ink-3);line-height:1.5}
.vide b{font-family:var(--font-display);color:var(--ink);font-size:var(--t-bloc);font-weight:600}
.vide code{display:block;width:100%;font-family:ui-monospace,Menlo,monospace;font-size:var(--t-legende);line-height:1.5;background:var(--surface-2);color:var(--ink);padding:8px 10px;border-radius:var(--r-petit);text-align:left;word-break:break-all;-webkit-user-select:all;user-select:all}
.note-zone{margin-top:12px}
.vide-astuce{display:flex;flex-direction:column;gap:8px;margin-top:8px;font-size:var(--t-meta)}
.vide .rond-ic{width:48px;height:48px;border-radius:50%;background:var(--accent-soft);color:var(--accent-action);display:flex;align-items:center;justify-content:center}
.titre-onglet{display:flex;flex-direction:column;gap:2px}
.titre-onglet b{font-family:var(--font-display);font-size:var(--t-carte);font-weight:600;letter-spacing:-.015em}
.titre-onglet small{font-size:var(--t-legende);color:var(--ink-3)}
.mini-etoile{width:12px;height:12px;fill:var(--accent-action);stroke:var(--accent-action);stroke-width:2;margin-left:6px;vertical-align:-1px;flex:none}

/* ---------- fiche */
.fiche{padding:16px 20px 20px;display:flex;flex-direction:column;gap:14px}
.fiche-haut{display:flex;align-items:center;justify-content:space-between;gap:12px}
.retour{display:flex;align-items:center;gap:8px;border:none;background:none;padding:0;color:var(--ink-2);font-size:var(--t-meta);font-weight:600;min-height:40px}
.retour:hover{color:var(--ink)}
.etoile{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--ink-2);padding:0;flex:none}
.etoile:hover{background:var(--surface-2)}
.etoile[aria-pressed="true"]{color:var(--accent-action);border-color:var(--accent-action);background:var(--accent-soft)}
.tete-fiche{gap:8px;padding:10px 20px 14px}
.tete-fiche .fiche-haut{margin:0 -4px}
.tete-fiche h1{font-size:var(--t-fiche);line-height:1.2;letter-spacing:-.02em}
.fiche-infos{display:flex;flex-direction:column;gap:6px}
.sous{font-size:var(--t-meta);color:var(--ink-3)}
.niveau{display:flex;align-items:center;gap:8px;margin-top:2px;font-size:var(--t-meta);font-weight:600}
.profil{background:var(--surface-2);border-radius:var(--r-carte);padding:12px 12px 8px}
.profil svg{display:block;width:100%;height:auto}
.pf-grille{stroke:var(--grille);stroke-width:1;stroke-dasharray:3 4}
.pf-txt{fill:var(--ink-2);font-family:var(--font);font-size:11px;font-weight:500}
.pf-aire{fill:var(--accent-soft)}
.pf-ligne{fill:none;stroke:var(--accent-action);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.pf-dep{fill:var(--surface);stroke:var(--accent-action);stroke-width:2.5}
.pf-arr{fill:var(--accent-action);stroke:var(--surface);stroke-width:2}
.segment.sens button{display:flex;align-items:center;justify-content:center;gap:6px}
.segment.sens .ic{width:16px;height:16px}
.pf-zone{position:relative;touch-action:pan-y;-webkit-user-select:none;user-select:none;cursor:crosshair}
.pf-curseur{position:absolute;inset:0;pointer-events:none;visibility:hidden;contain:layout style;overflow:visible}
.pf-curseur.actif{visibility:visible}
.pf-guide,.pf-point,.pf-bulle{position:absolute;left:0;top:0;will-change:transform}
.pf-guide{width:0;border-left:1px dashed var(--ink-3)}
.pf-point{width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:var(--curseur-fond);box-shadow:0 0 0 2.5px var(--curseur-bord)}
.pf-bulle{padding:3px 8px;border-radius:6px;background:var(--curseur-fond);color:var(--curseur-ink);font-size:11px;font-weight:600;line-height:14px;white-space:nowrap}
.curseur-carte{display:block;width:18px;height:18px;border-radius:50%;background:var(--curseur-fond);border:3px solid var(--curseur-bord);box-shadow:0 1px 4px rgba(15,44,39,.4)}
.tuiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tuile{background:var(--surface-2);border-radius:var(--r-moyen);padding:10px 14px}
.tuile small{display:block;font-size:var(--t-legende);color:var(--ink-2)}
.tuile b{font-family:var(--font-display);font-size:var(--t-carte);font-weight:600}
.seance-bloc{border:1px solid var(--line);border-radius:var(--r-carte);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.seance-ligne{display:flex;align-items:center;justify-content:space-between}
.compteur{display:flex;align-items:center;gap:8px}
.compteur button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line-fort);background:var(--surface);color:var(--ink);padding:0;display:flex;align-items:center;justify-content:center}
.compteur button:hover{background:var(--surface-2)}
.compteur span{min-width:84px;text-align:center;font-size:var(--t-texte);font-weight:600}
.total{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.total b{font-family:var(--font-display);font-size:var(--t-carte);font-weight:600;color:var(--accent-texte)}
.total span{font-size:var(--t-meta);color:var(--ink-3)}
.fiche-ctas{display:flex;flex-direction:column;gap:12px;margin-top:4px}
.fiche-ctas .lien{align-self:center}

/* ---------- barre d'onglets (téléphone : en bas, vert profond comme le bandeau) */
.onglets{position:fixed;z-index:900;left:0;right:0;bottom:0;height:calc(var(--barre) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:flex;justify-content:center;background:var(--bar-bg);border-top:1px solid var(--bar-line)}
.onglet{position:relative;flex:1;max-width:180px;height:var(--barre);border:none;background:transparent;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-family:var(--font-display);font-size:var(--t-legende);font-weight:600;color:var(--bar-ink-2)}
.onglet .ic{width:22px;height:22px}
.onglet:hover{color:var(--bar-ink)}
.onglet[aria-current="page"]{color:var(--bar-ink)}
.onglet[aria-current="page"] .ic{color:var(--logo)}
.onglet[aria-current="page"]::before{content:"";position:absolute;top:-1px;left:50%;width:44px;margin-left:-22px;height:3px;border-radius:0 0 3px 3px;background:var(--logo)}
.onglet:focus-visible{outline:2px solid var(--logo);outline-offset:-4px}

/* ---------- ordinateur : les onglets montent dans le bandeau, comme sur Senzu */
@media (min-width:901px){
  :root{--bandeau:60px}
  .bh-int{padding:0 24px}
  .marque-logo{width:28px;height:32px}
  .marque-nom{font-size:23px}
  .puce-pos{max-width:280px}
  .onglets{top:0;bottom:auto;left:50%;right:auto;transform:translateX(-50%);height:var(--bandeau);padding:0;gap:4px;align-items:center;background:none;border:none;z-index:960}
  .onglet{flex:none;max-width:none;height:36px;padding:0 14px;flex-direction:row;gap:0;border-radius:var(--r-moyen);font-size:var(--t-texte);transition:background .15s,color .15s}
  .onglet .ic{display:none}
  .onglet:hover{background:var(--bar-hover)}
  .onglet[aria-current="page"]{background:var(--bar-active)}
  .onglet[aria-current="page"]::before{display:none}
  #resultats{bottom:0}
  .toast{bottom:24px}
  #accueil{padding:32px 40px 48px}
  .acc-titre h1{font-size:32px}
  .acc-grille{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);align-items:start}
  .tuiles-seances{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));overflow:visible;margin:0;padding:0}
  .tuile-seance{width:auto}
}
/* ---------- téléphone */
@media (max-width:900px){
  /* Carte et Favoris : la carte prend tout l'écran sous la barre d'état ; le bandeau Senzu reste sur l'accueil */
  body.sur-carte{padding-top:var(--encoche);overflow:hidden}
  body.sur-carte .bandeau-haut{height:var(--encoche);padding-top:0;border-bottom:none}
  body.sur-carte .bh-int{display:none}
  #resultats{top:var(--encoche);overflow:hidden}
  .outils{top:12px;right:12px;transition:opacity .2s}
  .info-carte{right:10px;bottom:calc(var(--feuille-h,50%) + 10px);transition:bottom .3s cubic-bezier(.2,.8,.2,1)}
  #resultats.feuille-grande .outils,#resultats.feuille-grande .info-carte{opacity:0;visibility:hidden}
  /* feuille du bas : trois hauteurs (réduite, moitié, grande), à faire glisser comme sur Strava */
  #panneau{top:auto;left:0;right:0;bottom:0;width:auto;height:50%;border:none;border-radius:var(--r-grand) var(--r-grand) 0 0;box-shadow:0 -2px 18px rgba(15,44,39,.16);transition:transform .3s cubic-bezier(.2,.8,.2,1);will-change:transform}
  #panneau.glisse{transition:none}
  .panneau-tete{position:relative;padding-top:22px;touch-action:pan-x}
  .poignee{display:flex;position:absolute;top:0;left:50%;width:80px;height:24px;margin-left:-40px;border:none;background:none;padding:0;align-items:center;justify-content:center;touch-action:none}
  .poignee i{width:36px;height:5px;border-radius:3px;background:var(--line-fort)}
  .panneau-corps{overflow:hidden;touch-action:none}
  #resultats.feuille-grande .panneau-corps{overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y}
  #resultats:not(.feuille-grande) .pf-zone{touch-action:none}
  .puces{touch-action:pan-x}
  .tete-fiche h1{font-size:20px}
  body{padding-bottom:calc(var(--barre) + env(safe-area-inset-bottom))}
  #accueil{padding-bottom:24px}
}
@media (max-width:380px){
  .marque-nom{font-size:19px}
  .puce-pos{padding:0 10px}
}
@media (prefers-reduced-motion:reduce){.onglet,.tuile-seance,.btn-principal{transition:none}}
</style>
</head>

function montrerAttente() {

}
function localiser(centrer) {
  if (centrer) etat.centrerSurMoi = true;
  if (etat.attente) return;   // une seule demande à la fois (deux demandes croisées donnaient un faux échec)
  if (!navigator.geolocation) {
    etat.centrerSurMoi = false;
    if (!etat.gps) signaler('Mon navigateur ne permet pas de me localiser : Senzu part du centre de ma zone.');
    return;
  }
  etat.attente = true;
  etat.message = null;
  montrerAttente();
  const reussite = p => {
    etat.attente = false;
    const c = [p.coords.latitude, p.coords.longitude];
    if (!dansZone(c)) { etat.centrerSurMoi = false; signaler(horsZone(c)); montrerAttente(); return; }
    positionTrouvee(c, Math.round(p.coords.accuracy || 0) || null);
  };
  const echec = err => {
    etat.attente = false;
    etat.centrerSurMoi = false;
    // une position exacte est déjà connue : on la garde, sans message d'erreur
    if (!etat.gps) signaler(err && err.code === 1
      ? 'Accès à ma position refusé : l\'autoriser dans les réglages du navigateur. En attendant, Senzu part du centre de ma zone.'
      : 'Position exacte indisponible pour l\'instant : réessayer dans un moment. En attendant, Senzu part du centre de ma zone.');
    montrerAttente();
  };
  // d'abord le GPS précis, puis, s'il ne répond pas, la localisation par Wi-Fi (souvent la seule sur un ordinateur)
  navigator.geolocation.getCurrentPosition(reussite, err => {

    + '<div class="seance-bloc"><div class="seance-ligne"><b>Ma séance</b><span class="compteur"><button type="button" data-reps="-1" aria-label="Une répétition de moins">' + ic('moins') + '</button><span aria-live="polite"><b id="reps">' + etat.reps + '</b> ' + (enDescente() ? 'descentes' : 'montées') + '</span><button type="button" data-reps="1" aria-label="Une répétition de plus">' + ic('plus') + '</button></span></div>'
    + '<div class="total"><b class="chiffre" id="total">' + total + ' m ' + (enDescente() ? 'de D−' : 'de D+') + '</b><span id="comparaison">' + comparaison(total) + '</span></div></div>'
    + '<div class="fiche-ctas"><a class="btn-principal" href="' + lienItineraire(c) + '" target="_blank" rel="noopener">' + ic('nav') + 'Itinéraire jusqu\'au départ</a>'
    + '<a class="lien" href="https://www.openstreetmap.org/?mlat=' + c.coords[0][0] + '&amp;mlon=' + c.coords[0][1] + '#map=17/' + c.coords[0][0] + '/' + c.coords[0][1] + '" target="_blank" rel="noopener">Voir sur OpenStreetMap</a></div>'
    + '</div></div>';
}

/* ---------- profil ↔ carte : survoler le profil fait suivre un point sur le tracé */
function longueursCumulees(c) {
  if (!c._cum) {
    const cum = [0];
    for (let i = 1; i < c.coords.length; i++) cum.push(cum[i - 1] + dist(c.coords[i - 1], c.coords[i]));
    c._cum = cum;
  }
  return c._cum;
}
function pointSurTrace(c, f) {
  // profil et tracé sont allégés séparément : on se repère à la fraction de longueur parcourue
  const cum = longueursCumulees(c), cible = f * cum[cum.length - 1];
  let i = 1;
  while (i < cum.length - 1 && cum[i] < cible) i++;
  const a = c.coords[i - 1], b = c.coords[i], s = cum[i] - cum[i - 1];
  const k = s > 0 ? Math.min(1, Math.max(0, (cible - cum[i - 1]) / s)) : 0;
  return [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k];
}
function altitudeA(p, v) {
  let i = 1;
  while (i < p.length - 1 && p[i][0] < v) i++;
  const a = p[i - 1], b = p[i], s = b[0] - a[0];
  return s > 0 ? a[1] + (b[1] - a[1]) * Math.min(1, Math.max(0, (v - a[0]) / s)) : a[1];
}
let curseurRaf = 0, curseurDemande = null, curseurEls = null, coteAffichee = null;
function montrerCurseur(boite, clientX) {
  const id = Number(boite.dataset.id), zone = boite.querySelector('.pf-zone');
  // la fiche montre la côte dans son sens (retournée en descente) : le survol suit exactement ce qui est dessiné
  const c = coteAffichee && coteAffichee.id === id ? coteAffichee : parId[id];
  if (!c || !zone) return;
  const G = c._geo || (c._geo = geoProfil(c));
  const r = zone.getBoundingClientRect();  // seule lecture de mise en page, avant toute écriture
  const s = r.width / PF.W;
  if (!curseurEls || curseurEls.zone !== zone) {
    const cur = zone.querySelector('.pf-curseur');
    curseurEls = {zone: zone, cur: cur, guide: cur.querySelector('.pf-guide'), point: cur.querySelector('.pf-point'), bulle: cur.querySelector('.pf-bulle'), s: 0, txt: '', lg: -1, bw: 0};
  }
  const E = curseurEls;
  if (E.s !== s) { E.s = s; E.guide.style.top = (PF.haut * s) + 'px'; E.guide.style.height = ((PF.bas - PF.haut) * s) + 'px'; }
  const v = Math.max(0, Math.min(G.dmax, ((clientX - r.left) / s - PF.g) / (PF.W - PF.g - 4) * G.dmax));
  const z = altitudeA(G.p, v);
  const w = Math.min(15, G.dmax / 2), v1 = Math.max(0, v - w), v2 = Math.min(G.dmax, v + w);
  let pl = v2 > v1 ? Math.round((altitudeA(G.p, v2) - altitudeA(G.p, v1)) / (v2 - v1) * 100) : 0;
  const x = G.X(v) * s, y = G.Y(z) * s;
  const txt = longTxt(v) + ' · alt. ' + Math.round(z) + ' m · ' + (pl < 0 ? '−' : '') + Math.abs(pl) + ' %';
  if (txt !== E.txt) {
    E.bulle.textContent = txt; E.txt = txt;
    if (txt.length !== E.lg) { E.lg = txt.length; E.bw = E.bulle.offsetWidth; }  // mesure seulement si la longueur change
  }
  const bx = Math.max(-8, Math.min(r.width - E.bw + 8, x - E.bw / 2)), by = y - 30 >= -6 ? y - 30 : y + 10;
  E.guide.style.transform = 'translateX(' + x.toFixed(1) + 'px)';
  E.point.style.transform = 'translate(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px)';
  E.bulle.style.transform = 'translate(' + bx.toFixed(1) + 'px,' + by.toFixed(1) + 'px)';
  if (!curseurActif) { E.cur.classList.add('actif'); curseurActif = true; }
  if (!carte || !couches) return;
  const ll = pointSurTrace(c, v / G.dmax);
  if (curseurCarte) curseurCarte.setLatLng(ll);
  else curseurCarte = L.marker(ll, {icon: L.divIcon({className: 'repere-ancre', html: '<span class="curseur-carte"></span>', iconSize: [18, 18], iconAnchor: [9, 9]}), interactive: false, keyboard: false, zIndexOffset: 2000}).addTo(couches.curseur);
}
// au plus une mise à jour par image affichée, avec la dernière position connue
function demanderCurseur(boite, clientX) {
  curseurDemande = [boite, clientX];
  if (!curseurRaf) curseurRaf = requestAnimationFrame(() => { curseurRaf = 0; const d = curseurDemande; if (d) montrerCurseur(d[0], d[1]); });
}
function cacherCurseur() {
  curseurDemande = null;
  if (curseurRaf) { cancelAnimationFrame(curseurRaf); curseurRaf = 0; }
  if (!curseurActif) return;
  curseurActif = false;
  document.querySelectorAll('.pf-curseur.actif').forEach(e => e.classList.remove('actif'));
  if (couches) couches.curseur.clearLayers();
  curseurCarte = null;
}
const boiteProfil = e => e.target && e.target.closest ? e.target.closest('.profil[data-id]') : null;
document.addEventListener('pointermove', e => { const b = boiteProfil(e); if (b) demanderCurseur(b, e.clientX); else if (e.pointerType === 'mouse' && curseurActif) cacherCurseur(); }, {passive: true});
document.addEventListener('pointerdown', e => { const b = boiteProfil(e); if (b) demanderCurseur(b, e.clientX); else cacherCurseur(); }, {passive: true});
document.addEventListener('pointercancel', cacherCurseur);
// au doigt, le point reste affiché après le toucher ; il s'efface au prochain toucher ailleurs
document.documentElement.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') cacherCurseur(); });

/* ---------- feuille du bas (téléphone) : trois hauteurs, comme sur Strava ; la carte reste entière dessous */
const HAUTEURS = ['reduite', 'moitie', 'grande'];
let feuilleH = 0, glisse = null, finGlisse = 0, tire = null;
function hauteursFeuille() {
  const H = $('#resultats').clientHeight, tete = $('#panneau .panneau-tete');
  const reduite = Math.min(Math.round(H * 0.45), tete ? tete.offsetHeight : 120);
  const grande = Math.max(reduite, H - 56);
  return {reduite: reduite, moitie: Math.min(grande, Math.max(reduite + 120, Math.round(H * 0.5))), grande: grande};
}
// la feuille a toujours sa hauteur maximale ; on la fait descendre (transformation : fluide au doigt)
function placerFeuille(h, hs) {
  const p = $('#panneau');
  p.style.height = hs.grande + 'px';
  p.style.transform = 'translate3d(0,' + Math.round(hs.grande - h) + 'px,0)';
}
function poserFeuille(nom) {
  etat.feuille = nom;
  const res = $('#resultats'), p = $('#panneau');
  if (largeur()) {   // ordinateur : panneau flottant, toujours entier
    p.style.height = ''; p.style.transform = '';
    res.classList.remove('feuille-grande'); res.style.removeProperty('--feuille-h');
    return;
  }
  const hs = hauteursFeuille();
  feuilleH = hs[nom];
  placerFeuille(feuilleH, hs);
  res.style.setProperty('--feuille-h', feuilleH + 'px');
  res.classList.toggle('feuille-grande', nom === 'grande');
  const corps = p.querySelector('.panneau-corps');
  if (corps && nom !== 'grande') corps.scrollTop = 0;   // à mi-hauteur, la liste ne défile pas : on tire la feuille
  const pg = p.querySelector('.poignee');
  if (pg) pg.setAttribute('aria-label', nom === 'grande' ? 'Réduire la liste' : 'Agrandir la liste');
}
function ajusterFeuille() { if (etat.onglet !== 'accueil') poserFeuille(etat.feuille); }
// hauteur de carte cachée par la feuille (en grand, on compte la mi-hauteur : la liste ne change pas)
function feuilleVisible() {
  if (largeur()) return 0;
  return etat.feuille === 'grande' ? hauteursFeuille().moitie : feuilleH;
}
const panneauEl = $('#panneau');
function debutGlisse(id, x, y, t) {
  glisse = {id: id, x0: x, y0: y, h0: feuilleH, h: feuilleH, actif: false, y: y, t: t, v: 0, hs: null, raf: 0};
}
function activerGlisse() {
  glisse.actif = true;
  panneauEl.classList.add('glisse');
  cacherCurseur();
}
function suivreGlisse(y, t) {
  const g = glisse, hs = g.hs || (g.hs = hauteursFeuille());
  let h = Math.min(hs.grande, g.h0 - (y - g.y0));
  if (h < hs.reduite) h = hs.reduite - Math.min(40, (hs.reduite - h) * 0.25);   // un peu d'élasticité en bas
  const dt = t - g.t;
  if (dt > 0) { g.v = 0.7 * (y - g.y) / dt + 0.3 * g.v; g.y = y; g.t = t; }
  g.h = h;
  if (!g.raf) g.raf = requestAnimationFrame(() => { g.raf = 0; if (glisse === g) placerFeuille(g.h, hs); });
}
// au relâcher : vers la hauteur suivante si le geste était vif, sinon vers la plus proche
function finirGlisse() {
  const g = glisse;
  glisse = null;
  if (!g || !g.actif) return;
  if (g.raf) cancelAnimationFrame(g.raf);
  panneauEl.classList.remove('glisse');
  finGlisse = performance.now();
  const hs = g.hs || hauteursFeuille(), h = g.h;
  let nom;
  if (Math.abs(g.v) > 0.35) nom = g.v > 0 ? HAUTEURS.slice().reverse().find(n => hs[n] < h - 4) || 'reduite' : HAUTEURS.find(n => hs[n] > h + 4) || 'grande';
  else nom = HAUTEURS.reduce((a, n) => Math.abs(hs[n] - h) < Math.abs(hs[a] - h) ? n : a, 'reduite');
  poserFeuille(nom);
  rendreListe();
}
panneauEl.addEventListener('pointerdown', e => {
  if (largeur() || e.button > 0 || glisse) return;
  // en grand, la liste défile : la feuille se tire par son en-tête (ou en tirant la liste vers le bas, voir plus bas)
  if (etat.feuille === 'grande' && !e.target.closest('.panneau-tete')) return;
  if (e.target.closest('select')) return;
  debutGlisse(e.pointerId, e.clientX, e.clientY, e.timeStamp);
});
panneauEl.addEventListener('pointermove', e => {
  const g = glisse;
  if (!g || g.id !== e.pointerId) return;
  if (!g.actif) {
    const dx = e.clientX - g.x0, dy = e.clientY - g.y0;
    if (Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy)) { glisse = null; return; }   // geste de côté : puces, profil
    if (Math.abs(dy) < 8) return;
    activerGlisse();
    try { panneauEl.setPointerCapture(e.pointerId); } catch (err) {}
  }
  suivreGlisse(e.clientY, e.timeStamp);
});
panneauEl.addEventListener('pointerup', e => { if (glisse && glisse.id === e.pointerId) finirGlisse(); });
panneauEl.addEventListener('pointercancel', e => { if (glisse && glisse.id === e.pointerId) finirGlisse(); });
// en grand, tirer la liste vers le bas quand elle est tout en haut fait redescendre la feuille
panneauEl.addEventListener('touchstart', e => {
  tire = null;
  if (largeur() || etat.feuille !== 'grande' || e.touches.length !== 1 || glisse) return;
  const corps = e.target.closest('.panneau-corps');
  if (corps && corps.scrollTop <= 0) tire = {x: e.touches[0].clientX, y: e.touches[0].clientY};
}, {passive: true});
panneauEl.addEventListener('touchmove', e => {
  if (!tire) return;
  const t = e.touches[0];
  if (!glisse) {
    const dx = t.clientX - tire.x, dy = t.clientY - tire.y;
    if (dy <= 0 || Math.abs(dx) > dy) { tire = null; return; }   // vers le haut ou de côté : la liste défile normalement
    debutGlisse('doigt', tire.x, tire.y, e.timeStamp);
    activerGlisse();
  }
  if (glisse.id !== 'doigt') return;
  e.preventDefault();
  suivreGlisse(t.clientY, e.timeStamp);
}, {passive: false});
const finTirer = () => { if (tire) { tire = null; if (glisse && glisse.id === 'doigt') finirGlisse(); } };
panneauEl.addEventListener('touchend', finTirer);
panneauEl.addEventListener('touchcancel', finTirer);
// après un glissement, le relâcher ne compte pas comme un toucher sur la ligne de dessous
panneauEl.addEventListener('click', e => { if (performance.now() - finGlisse < 350) { e.stopPropagation(); e.preventDefault(); } }, true);

/* ---------- actions */
function rendreTout() { rendrePanneau(); rendreCarte(); }
function selectionner(id, depuisListe) {
  etat.sel = id; etat.selCarte = !depuisListe;
  rendreTout();
  const c = coteVue(id), b = boiteVisible();
  // un favori hors de la vue : la carte va le chercher (dans la liste de l'onglet Carte, la côte est déjà visible)
  if (c && depuisListe && b && !dansBoite(b, c.coords[0])) cadrerCote(c);
  if (!depuisListe) {
    const corps = $('#panneau .panneau-corps');
    if (corps) corps.scrollTop = 0;
    if (!largeur() && etat.feuille === 'reduite') {
      poserFeuille('moitie');
      // la feuille remonte : si le départ de la côte passe dessous, la carte remonte d'autant (la liste suit)
      const p = c && carte.latLngToContainerPoint(c.coords[0]), limite = carte.getSize().y - feuilleVisible() - 48;
      if (p && p.y > limite) carte.panBy([0, p.y - limite]);
      else rendreListe();
    }
  }
  const bt = document.querySelector('[data-sel="' + id + '"]');
  if (!bt) return;
  if (depuisListe) bt.focus({preventScroll: true});
  // téléphone : si les boutons de la côte choisie dépassent de la feuille, elle s'agrandit
  if (depuisListe && !largeur() && etat.feuille !== 'grande') {
    const el = document.getElementById('el-' + id);
    if (el && el.getBoundingClientRect().bottom > $('#resultats').getBoundingClientRect().bottom - 4) poserFeuille('grande');
  }
}
// la feuille reprend la hauteur qu'elle avait avant l'ouverture de la fiche
function retrouverFeuille() {
  const f = etat.feuilleAvantFiche;
  etat.feuilleAvantFiche = null;
  if (f && f !== etat.feuille) { poserFeuille(f); rendreListe(); }
}
function deselectionner() {
  if (etat.sel === null && etat.fiche === null) return;
  const fiche = etat.fiche !== null;
  etat.sel = null; etat.fiche = null; etat.selCarte = false; etat.vueAvantFiche = null;
  rendreTout();
  if (fiche) retrouverFeuille();
}
function ouvrirFiche(id, n) {
  const brut = parId[id];
  if (!brut) return;
  if (etat.fiche === null && carte) { etat.vueAvantFiche = {c: carte.getCenter(), z: carte.getZoom()}; etat.feuilleAvantFiche = etat.feuille; }
  etat.sensFiche = null;
  etat.fiche = id; etat.sel = id;
  etat.reps = n || repetitions(etat.onglet === 'carte' ? etat.seance : 'toutes', brut);
  rendreTout();
  if (etat.feuille !== 'moitie') poserFeuille('moitie');
  cadrerCote(coteVue(id), true);
  const r = document.querySelector('[data-action="fermer"]');
  if (r) r.focus({preventScroll: true});
}
function fermerFiche() {
  const id = etat.fiche;
  etat.fiche = null;
  // je retrouve la carte et la liste telles que je les avais laissées
  if (etat.vueAvantFiche && carte) carte.setView(etat.vueAvantFiche.c, etat.vueAvantFiche.z, {animate: false});
  etat.vueAvantFiche = null;
  rendreTout();
  retrouverFeuille();
  const b = document.querySelector('[data-sel="' + id + '"]');
  if (b) {
    b.focus({preventScroll: true});
    if (largeur() || etat.feuille === 'grande') document.getElementById('el-' + id).scrollIntoView({block: 'nearest'});
  }
}
function changerReps(sens) {
  etat.reps = Math.min(30, Math.max(1, etat.reps + sens));
  const c = coteVue(etat.fiche);
  if (!c) return;
  const total = Math.round(etat.reps * c.denivele);
  $('#reps').textContent = etat.reps;
  $('#total').textContent = total + ' m ' + (enDescente() ? 'de D−' : 'de D+');
  $('#comparaison').textContent = comparaison(total);
}
document.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  const a = b.dataset;
  if (b.id !== 'btn-fond' && a.fond === undefined && !$('#menu-fond').hidden) { $('#menu-fond').hidden = true; $('#btn-fond').setAttribute('aria-expanded', 'false'); }
  if (b.id === 'btn-theme') { basculerTheme(); return; }
  if (a.onglet) { aller(a.onglet); return; }
  if (b.id === 'btn-localiser') { localiser(); return; }
  if (b.id === 'btn-zoom-plus') { carte.zoomIn(); return; }
  if (b.id === 'btn-zoom-moins') { carte.zoomOut(); return; }
  // « Me localiser » : la carte va tout de suite sur ma dernière position connue, puis sur la position fraîche
  if (b.id === 'btn-recentrer') { if (etat.gps) centrerSur(etat.gps.coords, true); localiser(true); return; }
  if (b.id === 'btn-info') { ouvrirInfo(!$('#info-carte').classList.contains('ouverte')); return; }
  if (b.id === 'btn-fond') { const m = $('#menu-fond'); m.hidden = !m.hidden; b.setAttribute('aria-expanded', String(!m.hidden)); return; }
  if (a.fond !== undefined) { changerFond(Number(a.fond)); $('#menu-fond').hidden = true; $('#btn-fond').setAttribute('aria-expanded', 'false'); return; }
  if (a.favori) {
    const id = Number(a.favori);
    basculerFavori(id);
    rendreOnglets();
    // retirée de mes favoris depuis l'onglet Favoris : retour à la liste
    if (etat.onglet === 'favoris' && !estFavori(id)) { etat.sel = null; fermerFiche(); }
    else rendrePanneau();
    return;
  }
  if (a.seance) {
    etat.seance = a.seance; etat.sel = null; etat.fiche = null; etat.max = 40;
    if (etat.onglet === 'accueil') aller('carte', () => cadrerSeance(a.seance, origine()));
    else { rendreTout(); const c = $('#panneau .panneau-corps'); if (c) c.scrollTop = 0; }
    return;
  }
  if (a.ouvrir) { ouvrirDepuisAccueil(Number(a.ouvrir), a.sc, a.n ? Number(a.n) : 0); return; }
  if (a.sel) { selectionner(Number(a.sel), true); return; }
  if (a.fiche) { ouvrirFiche(Number(a.fiche)); return; }
  if (a.reps) { changerReps(Number(a.reps)); return; }
  if (a.sens) {
    etat.sensFiche = a.sens;
    rendreTout();
    const bt = document.querySelector('[data-sens="' + a.sens + '"]');
    if (bt) bt.focus({preventScroll: true});
    return;
  }
  switch (a.action) {
    case 'fermer': fermerFiche(); break;
    case 'autre-idee': etat.idee++; rendreAccueil(); break;
    case 'fermer-message': etat.message = null; rendreAccueil(); break;
    case 'voir-carte': etat.seance = 'toutes'; aller('carte', () => cadrerAutour(origine(), 1500)); break;
    case 'plus': etat.max += 40; rendreListe(true); break;
    case 'poignee': poserFeuille(etat.feuille === 'reduite' ? 'moitie' : etat.feuille === 'moitie' ? 'grande' : 'moitie'); rendreListe(); break;
    case 'revenir-zone': cadrerAutour(origine(), 1500, true); break;
    case 'plus-proches': { const bx = boiteVisible(); if (bx) cadrerSeance(etat.seance, centreBoite(bx), true); break; }
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && etat.fiche !== null) fermerFiche();
});
document.addEventListener('change', e => {
  if (e.target.id !== 'tri') return;
  etat.tri = e.target.value; etat.max = 40;
  rendreTout();
  const corps = $('#panneau .panneau-corps');
  if (corps) corps.scrollTop = 0;
  const s = $('#tri');
  if (s) s.focus();
});
function ouvrirDepuisAccueil(id, s, n) {
  const c = parId[id];
  if (!c) return;
  if (s === 'fav') { aller('favoris'); ouvrirFiche(id); return; }
  etat.seance = s && D.seances.some(x => x.id === s) ? s : 'toutes';
  // la carte s'ouvre autour de la côte : en refermant la fiche, je vois ses voisines
  aller('carte', () => cadrerAutour(departPour(c, etat.seance), 700));
  ouvrirFiche(id, n);
}
document.querySelectorAll('[data-icone]').forEach(el => { el.innerHTML = ic(el.dataset.icone); });
window.addEventListener('resize', () => {
  if (!carte || etat.onglet === 'accueil') return;
  carte.invalidateSize({pan: false});
  ajusterFeuille();
  listeSuitLaCarte();
});
peindreBoutonTheme();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
aller('accueil');
</script>
